name: Deploy dashboard

on:
  schedule:
    # UTC 工作日 16:30，即北京时间次日 00:30：留出上交所
    # ETF 清算后规模数据（每交易日 23:00 更新）的落库缓冲时间。
    - cron: '30 16 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # Upstream ETF price/scale endpoints occasionally publish late or return
      # a transient error.  Do not deploy incomplete data; retry the complete
      # export before preserving the last known-good Pages version.
      - name: Generate dashboard data (retry transient upstream failures)
        run: |
          for attempt in 1 2 3; do
            if python -m pipeline.export; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Export failed (attempt $attempt); retrying in 5 minutes..."
              sleep 300
            fi
          done
          exit 1

      - name: Verify generated data.json is valid
        run: python -c "import json; json.load(open('site/data.json'))" && echo "data.json is valid JSON"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
